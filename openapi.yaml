openapi: 3.0.4
info:
  title: Word Pronunciation
  description: >-
    Word Pronunciation is a pronunciation API that retrieves the phonetic
    pronunciation of any English word in ARPAbet format. Pass a word to receive
    its phonetic transcription for speech synthesis, dictionaries, or language
    tools.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/wordpronunciation:
    get:
      summary: Word Pronunciation
      description: Get the pronunciation of a word
      operationId: wordpronunciation
      parameters:
        - name: word
          in: query
          schema:
            type: string
          required: true
          description: The word to get the pronunciation of
          example: hello
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  word: hello
                  pronounciation: HH AH0 L OW1
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
